<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HrAgent · 多模态 AI 面试官</title>
<style>
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --line: #e4e8ef;
    --line-soft: #eef1f6;
    --text: #1b2130;
    --muted: #6b7280;
    --muted-2: #9aa3b2;
    --accent: #3b6cf6;
    --accent-soft: #eef3ff;
    --warn: #c2710c;
    --warn-soft: #fff8ec;
    --danger: #d64545;
    --danger-soft: #fef2f2;
    --ok: #0f9d63;
    --ok-soft: #ecfdf5;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .05);
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- 顶栏 ---------- */
  header {
    background: linear-gradient(180deg, #ffffff 0%, #fbfcfe 100%);
    border-bottom: 1px solid var(--line);
    padding: 16px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  header .logo {
    width: 30px; height: 30px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #7a5cf0);
    display: grid;
    place-items: center;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(59, 108, 246, .3);
    flex: none;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; letter-spacing: -.2px; }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .mode {
    margin-left: auto;
    font-size: 12px;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--warn-soft);
    color: #92600a;
    border: 1px solid #f5dfb8;
    font-weight: 500;
  }

  /* ---------- 布局 ---------- */
  main {
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 18px;
    padding: 18px 26px 32px;
    /* stretch：两栏等高。行高由左栏（摄像头）决定，右栏跟随 */
    align-items: stretch;
    max-width: 1320px;
    margin: 0 auto;
  }
  @media (max-width: 880px) {
    main { grid-template-columns: 1fr; padding: 14px; }
    /* 单栏时「两栏等高」不成立，改回按内容排布 + 限高滚动，
       否则 flex:1 1 0 会把聊天区压成 0 高 */
    .panel-chat { overflow: visible; }
    #log { flex: none; min-height: 0; max-height: 60vh; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px;
    box-shadow: var(--shadow);
    min-height: 0;          /* 允许在 grid 里被压到比内容矮，滚动才生效 */
  }
  .panel h2 {
    font-size: 12px;
    margin: 0 0 12px;
    color: var(--muted-2);
    font-weight: 600;
    letter-spacing: .4px;
    text-transform: uppercase;
  }

  /* ---------- 摄像头 ---------- */
  .camera {
    width: 100%;
    aspect-ratio: 4 / 3;
    background: linear-gradient(160deg, #1e2634, #0f1420);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border: 1px solid #1a2130;
  }
  .camera img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .camera .placeholder { color: #5b6678; font-size: 12.5px; }
  .camera .badge {
    position: absolute;
    top: 9px; left: 9px;
    background: rgba(0, 0, 0, .55);
    backdrop-filter: blur(4px);
    color: #fff;
    font-size: 10.5px;
    letter-spacing: .3px;
    padding: 3px 9px;
    border-radius: 5px;
  }

  /* ---------- 表单控件 ---------- */
  label {
    display: block;
    font-size: 11.5px;
    color: var(--muted);
    margin: 14px 0 5px;
    font-weight: 500;
  }
  select, button {
    font: inherit;
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s, background .15s, transform .06s;
  }
  select:focus-visible, button:focus-visible {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59, 108, 246, .14);
  }
  select:disabled { background: #fafbfd; color: var(--muted-2); }
  button {
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
    font-weight: 550;
    box-shadow: 0 1px 3px rgba(59, 108, 246, .25);
  }
  button:hover:not(:disabled) { background: #3260e8; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; }
  button.ghost {
    background: #fff;
    color: var(--text);
    border-color: var(--line);
    box-shadow: none;
  }
  button.ghost:hover:not(:disabled) { background: #f7f9fc; border-color: #d3d9e3; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { margin: 0; }
  .hint {
    font-size: 11.5px;
    color: var(--muted-2);
    margin-top: 14px;
    line-height: 1.6;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
  }
  .hint strong { color: var(--muted); font-weight: 600; }

  /* ---------- 对话气泡 ---------- */
  /* 聊天栏固定高度、内部滚动：flex:1 1 0 让 #log 不把内容高度贡献给面板，
     于是面板高度由左栏决定（两栏等高），多出来的对话在 #log 里滚。 */
  .panel-chat { display: flex; flex-direction: column; overflow: hidden; }
  #log {
    display: flex;
    flex-direction: column;
    gap: 16px;
    flex: 1 1 0;
    min-height: 320px;      /* 窗口很矮时也留出可读高度 */
    overflow-y: auto;
    overscroll-behavior: contain;   /* 滚到底不要把整页带着滚 */
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: #d3dae5 transparent;
  }
  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb {
    background: #d3dae5;
    border-radius: 4px;
  }
  #log::-webkit-scrollbar-thumb:hover { background: #bcc6d6; }
  .empty {
    color: var(--muted-2);
    font-size: 13px;
    padding: 48px 0;
    text-align: center;
  }
  .turn {
    display: flex;
    flex-direction: column;
    max-width: 86%;
    animation: pop .22s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .turn.q { align-self: flex-start; align-items: flex-start; }
  .turn.a { align-self: flex-end; align-items: flex-end; }
  .who {
    font-size: 11px;
    color: var(--muted-2);
    margin-bottom: 5px;
    padding: 0 3px;
    font-weight: 500;
  }
  .text {
    white-space: pre-wrap;
    word-break: break-word;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.65;
  }
  .turn.q .text {
    background: #fff;
    border: 1px solid var(--line);
    border-top-left-radius: 4px;
  }
  .turn.a .text {
    background: var(--accent-soft);
    border: 1px solid #dde7ff;
    color: #1c2b52;
    border-top-right-radius: 4px;
  }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .turn.a .meta { justify-content: flex-end; }
  .tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: #f2f4f8;
    color: #4b5563;
    border: 1px solid var(--line);
    font-weight: 500;
    white-space: nowrap;
  }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: #b6ecd2; }
  .tag.warn { background: var(--warn-soft); color: var(--warn); border-color: #f5dfb8; }
  .tag.danger { background: var(--danger-soft); color: var(--danger); border-color: #f7cfcf; }
  .note {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 5px;
    padding: 0 3px;
    line-height: 1.55;
    max-width: 100%;
  }
  .turn.a .note { text-align: right; }

  /* ---------- 状态栏 ---------- */
  .status { font-size: 12px; color: var(--muted); margin-top: 12px; min-height: 18px; line-height: 1.5; }
  .status.err { color: var(--danger); }
  .spinner::after {
    content: "";
    display: inline-block;
    width: 10px; height: 10px;
    margin-left: 6px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: -1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 报告 ---------- */
  #report { display: none; grid-column: 1 / -1; }
  .report-top {
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line-soft);
    margin-bottom: 18px;
  }
  .score-box { display: flex; flex-direction: column; }
  .score-box .cap { font-size: 11px; color: var(--muted-2); margin-bottom: 2px; }
  .score-line { display: flex; align-items: baseline; gap: 5px; }
  .score-line .num {
    font-size: 46px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -1.5px;
  }
  .score-line .num.pass { color: var(--ok); }
  .score-line .num.hold { color: var(--warn); }
  .score-line .num.fail { color: var(--danger); }
  .score-line .num.none { color: var(--muted-2); }
  .score-line .unit { font-size: 13px; color: var(--muted-2); }
  .verdict {
    flex: 1;
    min-width: 220px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13.5px;
    font-weight: 550;
    line-height: 1.5;
  }
  .verdict.pass { background: var(--ok-soft); color: #0a6b46; border: 1px solid #b6ecd2; }
  .verdict.hold { background: var(--warn-soft); color: #8a5a09; border: 1px solid #f5dfb8; }
  .verdict.fail,
  .verdict.review { background: var(--danger-soft); color: #9b2c2c; border: 1px solid #f7cfcf; }
  .verdict.unknown { background: #f4f5f7; color: #4b5563; border: 1px solid var(--line); }

  .summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .stat {
    flex: 1;
    min-width: 96px;
    background: #fafbfd;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    padding: 10px 13px;
  }
  .stat .k { font-size: 11px; color: var(--muted-2); margin-bottom: 3px; }
  .stat .v { font-size: 19px; font-weight: 650; letter-spacing: -.3px; }

  .rounds { display: flex; flex-direction: column; gap: 8px; }
  .round {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 14px;
    border: 1px solid var(--line-soft);
    border-radius: 9px;
    background: #fff;
    transition: border-color .15s, background .15s;
  }
  .round:hover { border-color: var(--line); background: #fcfdff; }
  .round.flagged { border-color: #f7cfcf; background: #fffafa; }
  .round .idx {
    font-size: 11.5px;
    color: var(--muted-2);
    min-width: 46px;
    font-weight: 500;
    flex: none;
  }
  .chip {
    font-size: 12px;
    font-weight: 650;
    min-width: 34px;
    text-align: center;
    padding: 3px 8px;
    border-radius: 6px;
    flex: none;
  }
  .chip.pass { background: var(--ok-soft); color: var(--ok); }
  .chip.hold { background: var(--warn-soft); color: var(--warn); }
  .chip.fail { background: var(--danger-soft); color: var(--danger); }
  .chip.none { background: #f2f4f8; color: var(--muted-2); }
  .round .cmt {
    flex: 1;
    font-size: 13px;
    color: #3f4859;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .round .flags { display: flex; gap: 6px; flex: none; }
</style>
</head>
<body>

<header>
  <span class="logo">H</span>
  <h1>HrAgent</h1>
  <span class="sub">多模态 AI 面试官 · 看画面 + 听回答</span>
  <span class="mode" id="modeBadge">模拟数据模式</span>
</header>

<main>
  <!-- 左：画面 + 控制 -->
  <section class="panel">
    <h2>候选人画面</h2>
    <div class="camera">
      <span class="badge">模拟</span>
      <span class="placeholder" id="camPlaceholder">尚未开始</span>
      <img id="cam" alt="候选人画面" hidden>
    </div>

    <label for="frameSel">模拟画面</label>
    <select id="frameSel"></select>

    <label for="audioSel">模拟回答音频</label>
    <select id="audioSel"></select>

    <div class="row">
      <button id="startBtn">开始面试</button>
      <button id="sendBtn" disabled>发送回答</button>
    </div>
    <div class="row">
      <button id="reportBtn" class="ghost" disabled>查看报告</button>
    </div>

    <div class="status" id="status"></div>
    <p class="hint">
      当前为<strong>模拟数据模式</strong>：画面取自 fixture 图片，回答取自 fixture 音频。
      接入真实摄像头 / 麦克风后，只需替换采集部分，发送链路不变。
    </p>
  </section>

  <!-- 右：对话 -->
  <section class="panel panel-chat">
    <h2>面试记录</h2>
    <div id="log"><div class="empty">点击「开始面试」后，面试官会先提问。</div></div>
  </section>
</main>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const cam = $("cam"), camPlaceholder = $("camPlaceholder");
const frameSel = $("frameSel"), audioSel = $("audioSel");
const startBtn = $("startBtn"), sendBtn = $("sendBtn"), reportBtn = $("reportBtn");
const log = $("log"), statusEl = $("status");

// 唯一的界面状态源。按钮可不可点一律由 refreshButtons() 派生，
// 避免出现「某处禁用、另一处又启用」互相覆盖的情况（之前就是这么出的 bug）。
const state = { started: false, finished: false, turns: 0, busy: false };

// ---------------------------------------------------------------- 工具

function setStatus(msg, isErr) {
  statusEl.textContent = msg || "";
  // 用 classList 而不是整体赋值 className，否则会把 spinner 类一起抹掉
  statusEl.classList.toggle("err", !!isErr);
}

function refreshButtons() {
  const b = state.busy;
  startBtn.disabled = b;
  // 结束后不能再发；没开始也不能发
  sendBtn.disabled = b || !state.started || state.finished;
  // 一轮都没答时后端会返回 409，所以直接禁用，别让用户点了才报错
  reportBtn.disabled = b || state.turns === 0;
  // 请求飞行中锁住下拉框：否则用户中途改选项，屏幕显示的帧和实际提交的帧会对不上
  frameSel.disabled = b;
  audioSel.disabled = b;
}

function setBusy(on, msg) {
  state.busy = on;
  statusEl.classList.toggle("spinner", on);
  if (on) setStatus(msg || "处理中…");
  refreshButtons();
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function clearEmpty() {
  const e = log.querySelector(".empty");
  if (e) e.remove();
}

function addTurn(kind, who, text, tags) {
  clearEmpty();
  const box = el("div", "turn " + kind);
  box.appendChild(el("div", "who", who));
  box.appendChild(el("div", "text", text));
  if (tags && tags.length) {
    const meta = el("div", "meta");
    tags.forEach(([label, cls]) => meta.appendChild(el("span", "tag " + (cls || ""), label)));
    box.appendChild(meta);
  }
  log.appendChild(box);
  // 滚的是 #log 容器本身，不用 scrollIntoView —— 后者会连带把整页也滚下去
  log.scrollTo({ top: log.scrollHeight, behavior: "smooth" });
  return box;
}

// 把 base64 音频播出来
let currentAudio = null;   // 持有引用：否则 Audio 对象可能在播放途中被 GC 掉

function stopAudio() {
  if (!currentAudio) return;
  currentAudio.pause();
  URL.revokeObjectURL(currentAudio.src);
  currentAudio = null;
}

function playB64(b64) {
  if (!b64) return;
  try {
    const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
    stopAudio();
    const audio = new Audio(url);
    currentAudio = audio;
    audio.onended = () => {
      URL.revokeObjectURL(url);
      if (currentAudio === audio) currentAudio = null;
    };
    // 播不出来要让人知道，否则表现为「面试官不说话了」且毫无提示
    audio.play().catch(() => setStatus("语音播报被浏览器拦截，点一下页面任意处即可恢复", true));
  } catch (err) {
    setStatus("语音播报失败：" + err.message, true);
  }
}

// 统一的请求封装：带超时，避免后端卡住时按钮被永久锁死
async function api(path, opts = {}, timeoutMs = 180000) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(path, { ...opts, signal: ctrl.signal });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.detail || (res.status + " " + res.statusText));
    return data;
  } catch (err) {
    if (err.name === "AbortError") throw new Error("请求超时，后端可能卡住了");
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

// 取模拟素材。必须查 res.ok —— fetch 对 404 不会 reject，
// 不查的话会把 {"detail":"Not Found"} 当成音频发给后端。
async function fetchBlob(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("素材加载失败：" + url + "（HTTP " + res.status + "）");
  return res.blob();
}

// ---------------------------------------------------------------- 画面

function showFrame(name) {
  if (!name) return;
  cam.onerror = () => {                 // 图 404 时别只留一块黑
    cam.hidden = true;
    camPlaceholder.hidden = false;
    camPlaceholder.textContent = "画面加载失败";
  };
  cam.src = "/fixtures/frames/" + encodeURIComponent(name);
  cam.hidden = false;
  camPlaceholder.hidden = true;
}

frameSel.addEventListener("change", () => showFrame(frameSel.value));

// ---------------------------------------------------------------- 流程

async function loadFixtures() {
  const data = await api("/api/fixtures");
  for (const n of data.frames) frameSel.appendChild(new Option(n, n));
  for (const n of data.audio) audioSel.appendChild(new Option(n, n));
  // 默认选一张正对的，另提示 multiple 那张会触发作弊判定
  const preferred = data.frames.find((n) => n.startsWith("focused")) || data.frames[0];
  if (preferred) { frameSel.value = preferred; showFrame(preferred); }
}

async function startInterview() {
  // 后端 /api/start 会重置会话，已经答过就问一句，别把进度默默清掉
  if (state.turns > 0 && !confirm("重新开始会清空当前这场面试的记录，确定吗？")) return;

  setBusy(true, "正在开始…");
  try {
    const data = await api("/api/start", { method: "POST" });
    state.started = true;
    state.finished = false;
    state.turns = 0;
    log.innerHTML = "";
    stopAudio();
    addTurn("q", "面试官", data.question);
    playB64(data.audio);
    $("report").style.display = "none";
    setStatus("面试已开始，选好模拟画面和回答音频后点「发送回答」。");
  } catch (err) {
    setStatus("开始失败：" + err.message, true);
  } finally {
    setBusy(false);
  }
}

async function sendAnswer() {
  const frameName = frameSel.value;
  const audioName = audioSel.value;
  if (!frameName || !audioName) { setStatus("请先选择模拟画面和音频", true); return; }

  setBusy(true, "面试官正在看和听…（真实模型约需 10-20 秒）");
  try {
    // 取模拟素材 —— 真实模式下这里换成 MediaRecorder 录出来的 Blob
    const [audioBlob, frameBlob] = await Promise.all([
      fetchBlob("/fixtures/audio/" + encodeURIComponent(audioName)),
      fetchBlob("/fixtures/frames/" + encodeURIComponent(frameName)),
    ]);

    const form = new FormData();
    form.append("audio", audioBlob, audioName);
    form.append("frames", frameBlob, frameName);

    const data = await api("/api/turn", { method: "POST", body: form });
    state.turns += 1;

    const tags = [];
    tags.push(["得分 " + (data.score ?? "—"), ""]);
    tags.push([data.focused ? "专注" : "走神", data.focused ? "ok" : "warn"]);
    if (data.cheating) tags.push(["疑似作弊", "danger"]);

    const box = addTurn("a", "候选人（语音转写）", data.answer || "（未识别到语音）", tags);
    if (data.comment) box.appendChild(el("div", "note", "点评：" + data.comment));
    if (data.attention_note) box.appendChild(el("div", "note", "画面：" + data.attention_note));
    // parsed=false 表示模型没按约定格式返回，本轮走的是兜底问题。
    // 不说的话，用户会以为那句「能再展开说说吗」是模型真问的。
    if (data.parsed === false) {
      box.appendChild(el("div", "note", "⚠️ 本轮模型输出异常，已改用兜底追问"));
    }

    addTurn("q", "面试官", data.question);
    playB64(data.audio);

    if (data.finished) {
      state.finished = true;
      setStatus("面试已结束，可以查看报告了。");
    } else {
      setStatus("已处理完这一轮，可以继续发送。");
    }
  } catch (err) {
    setStatus("处理失败：" + err.message, true);
  } finally {
    // 禁用状态一律交给 refreshButtons() 派生，这里只负责收尾
    setBusy(false);
  }
}

// 分数分档 → 着色类名。阈值与后端 interview._recommend 的 8/6 保持一致，
// 否则会出现「报告说通过、每轮却标红」这种自相矛盾的呈现。
function scoreClass(score) {
  if (score == null) return "none";
  if (score >= 8) return "pass";
  if (score >= 6) return "hold";
  return "fail";
}

async function showReport() {
  setBusy(true, "正在生成报告…");
  try {
    const data = await api("/api/report");
    const panel = $("report");
    panel.innerHTML = "";

    // ---- 顶部：平均得分 + 结论横幅 ----
    const top = el("div", "report-top");

    const box = el("div", "score-box");
    box.appendChild(el("span", "cap", "平均得分"));
    const line = el("div", "score-line");
    line.appendChild(el("span", "num " + scoreClass(data.average_score),
                        data.average_score == null ? "—" : String(data.average_score)));
    if (data.average_score != null) line.appendChild(el("span", "unit", "/ 10"));
    box.appendChild(line);
    top.appendChild(box);

    // verdict 是后端给的枚举，不用中文串做关键词匹配
    top.appendChild(el("div", "verdict " + (data.verdict || "unknown"), data.recommendation));
    panel.appendChild(top);

    // ---- 统计小卡 ----
    const sum = el("div", "summary");
    const stats = [
      ["问答轮数", String(data.turns)],
      ["走神轮次", data.distracted_turns.length ? data.distracted_turns.join("、") : "无"],
      ["疑似作弊", data.cheating_turns.length ? data.cheating_turns.join("、") : "无"],
    ];
    for (const [k, v] of stats) {
      const s = el("div", "stat");
      s.appendChild(el("div", "k", k));
      s.appendChild(el("div", "v", v));
      sum.appendChild(s);
    }
    panel.appendChild(sum);

    // ---- 逐轮一行：得分 + 一句点评 + 异常标记（不展示问答全文）----
    panel.appendChild(el("h2", null, "逐轮明细"));
    const rounds = el("div", "rounds");
    for (const r of data.records) {
      const row = el("div", "round" + (r.cheating ? " flagged" : ""));
      row.appendChild(el("span", "idx", "第 " + r.index + " 轮"));
      row.appendChild(el("span", "chip " + scoreClass(r.score),
                         r.score == null ? "—" : String(r.score)));
      row.appendChild(el("span", "cmt", r.comment || "—"));
      const flags = el("div", "flags");
      flags.appendChild(el("span", "tag " + (r.focused ? "ok" : "warn"),
                           r.focused ? "专注" : "走神"));
      if (r.cheating) flags.appendChild(el("span", "tag danger", "疑似作弊"));
      row.appendChild(flags);
      rounds.appendChild(row);
    }
    panel.appendChild(rounds);

    panel.style.display = "block";
    panel.scrollIntoView({ behavior: "smooth", block: "start" });
    setStatus("报告已生成。");
  } catch (err) {
    setStatus("生成报告失败：" + err.message, true);
  } finally {
    setBusy(false);
  }
}

// ---------------------------------------------------------------- 绑定

startBtn.addEventListener("click", startInterview);
sendBtn.addEventListener("click", sendAnswer);
reportBtn.addEventListener("click", showReport);

// 报告容器需要在对话面板下方，动态插入
(function mountReport() {
  const panel = document.createElement("div");
  panel.id = "report";
  panel.className = "panel";
  panel.style.gridColumn = "1 / -1";
  document.querySelector("main").appendChild(panel);
})();

// 刷新页面后前端状态会丢，但后端会话还在。问一下后端，
// 免得用户以为没开始就点「开始面试」，把进行中的面试默默清掉。
async function restoreSession() {
  try {
    const s = await api("/api/status", {}, 10000);
    if (s.turns > 0) {
      state.started = true;
      state.turns = s.turns;
      state.finished = s.finished;
      setStatus(
        "检测到进行中的面试（已答 " + s.turns + " 轮）。界面对话记录无法恢复，" +
        "可直接「查看报告」；重新开始会清空它。"
      );
    }
  } catch (err) {
    /* 后端没起来也不该阻塞页面 */
  }
}

async function init() {
  refreshButtons();               // 先按初始状态把按钮摆正
  try {
    await loadFixtures();
  } catch (err) {
    setStatus("加载模拟素材失败：" + err.message, true);
    return;
  }
  await restoreSession();
  refreshButtons();
}

init();
</script>
